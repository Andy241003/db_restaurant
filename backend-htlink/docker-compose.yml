services:
  # Database is external. Configure MYSQL_* in .env or Coolify environment variables.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=4096
    restart: always
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_started

  adminer:
    image: adminer
    restart: always
    ports:
      - "8081:8080"

  prestart:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    profiles: ["setup"]
    command: bash scripts/prestart.sh
    env_file:
      - .env

volumes:
  backend-uploads:
